name: Mevzuat Taraması

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      gun:
        description: "Belirli bir günü tara (YYYY-MM-DD). Boşsa bugün."
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  tara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Resmî Gazete'yi tara
        id: tara
        run: python scripts/tara.py
        env:
          GUN: ${{ inputs.gun }}

      - name: Taslaklar için PR aç
        id: pr
        if: steps.tara.outputs.bulundu == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: taslak/${{ steps.tara.outputs.gun }}
          base: main
          add-paths: icerik/yazilar/
          commit-message: "Taslak: ${{ steps.tara.outputs.gun }} mevzuat güncellemeleri"
          title: "Taslak: ${{ steps.tara.outputs.gun }} mevzuat güncellemeleri"
          body-path: /tmp/pr_govde.md
          delete-branch: true

      - name: Telegram'a bildir
        if: steps.pr.outputs.pull-request-url != ''
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '[:space:]')
          CHAT=$(printf '%s' "$CHAT" | tr -d '[:space:]')
          { cat /tmp/telegram.txt; echo; echo "$PR_URL"; } > /tmp/mesaj.txt
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text@/tmp/mesaj.txt"
          echo

      - name: Hata olursa Telegram'a haber ver
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '[:space:]')
          CHAT=$(printf '%s' "$CHAT" | tr -d '[:space:]')
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=⚠️ Mevzuat taraması hata verdi: ${RUN_URL}"
