name: Mevzuat Erişim Testi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4 pypdf

      - name: mevzuat.gov.tr erişimini dene
        run: python scripts/mevzuat_test.py

      - name: Ham yanıtları kaydet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mevzuat-test-cikti
          path: mevzuat_test_cikti/
          if-no-files-found: ignore
